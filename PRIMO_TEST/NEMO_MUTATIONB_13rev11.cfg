%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file - plasma torch Ar/H2 87/13
% ultra-stable first ignition version
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%

SOLVER= NEMO_NAVIER_STOKES
MATH_PROBLEM= DIRECT
SYSTEM_MEASUREMENTS= SI

MACH_NUMBER= 0.05
LOW_MACH_CORR= YES
AOA= 0.0
SIDESLIP_ANGLE= 0.0

INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS

FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 300.0
FREESTREAM_TEMPERATURE_VE= 300.0

REF_DIMENSIONALIZATION= DIMENSIONAL

FLUID_MODEL= MUTATIONPP
GAS_MODEL= ArH2_87_13
TRANSPORT_COEFF_MODEL= WILKE

KIND_TURB_MODEL= NONE

% ordine specie: (Ar, H2, H)
GAS_COMPOSITION= ( 0.9925, 0.0075, 1.0E-12 )

MARKER_ISOTHERMAL= ( WALL_IN, 300.0, ELECTRODE_BODY, 300.0, WALL1, 1500.0, ELECTRODE, 1500.0, WALL2, 1500.0 )
MARKER_PLOTTING= ( WALL_IN, ELECTRODE_BODY, WALL1, ELECTRODE, WALL2 )
MARKER_SYM= ( SYMMETRY, SIDE )


MARKER_SUPERSONIC_INLET= ( INFLOW, 300.0, 130000.0, 20.0, 0.0, 0.0 )
INLET_TEMPERATURE_VE= 300.0
INLET_GAS_COMPOSITION= ( 0.9925, 0.0075, 1.0E-12 )

FROZEN_MIXTURE= YES

MARKER_OUTLET= ( OUTFLOW, 101325.0 )

NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES

% Adaptive time stepping parameters
CFL_NUMBER= 0.005
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.3, 1.2, 0.0005, 1.0 )
MAX_DELTA_TIME= 1E6

MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= NONE

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 0
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 50

MGLEVEL= 0

CONV_NUM_METHOD_FLOW= ROE

% Actually, we are seeing that the entropy coefficient does not affect at all the solution, maybe we can modify the code
ENTROPY_FIX_COEFF= 220.42

%%%%%%%%%%%%%%%%%%%%%%%
% HEAT SOURCE MODEL
%%%%%%%%%%%%%%%%%%%%%%%

HEAT_SOURCE = YES

AXISYMMETRIC= YES

% Power volume max [W/m^3]
HEAT_SOURCE_VAL= 3.0E10

% HEAT_SOURCE_ROTATION_Z = 0.0

% (x_start, y_center, z_center) [m]
HEAT_SOURCE_CENTER= ( 0.035, 0.0004, 0.0 )

% Sigma_r increased from 0.0045 to 0.007 to help convergence and increase the heat source
% (x_end, sigma_r, L_decay) [m]
HEAT_SOURCE_AXES= ( 0.080, 0.007, 0.020 )

ITER= 2000000
CONV_RESIDUAL_MINVAL= -16
CONV_STARTITER= 50

MESH_FILENAME= PRIMO_TEST/Nozzle_rev14.su2
MESH_FORMAT= SU2
OUTPUT_FILES= RESTART_ASCII, PARAVIEW_ASCII, SURFACE_PARAVIEW_ASCII
OUTPUT_WRT_FREQ= 500
WRT_RESTART_OVERWRITE= NO
RESTART_FILENAME= PRIMO_TEST/output/restart

VOLUME_FILENAME= PRIMO_TEST/vtk/vol_solution
SURFACE_FILENAME= PRIMO_TEST/vtk/surface_flow
WRT_VOLUME_OVERWRITE= NO
RESTART_SOL= YES
SOLUTION_FILENAME= PRIMO_TEST/output/restart_14
READ_BINARY_RESTART= NO

% Explicit time integration method using Runge-Kutta 
TIME_DISCRE_FLOW= RUNGE-KUTTA_EXPLICIT 
RK_ALPHA_COEFF= ( 0.25, 0.3333, 0.5, 1.0 )
