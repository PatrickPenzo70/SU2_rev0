%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file - plasma torch Ar/H2 87/13
% ultra-stable first ignition version
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%

SOLVER= NEMO_NAVIER_STOKES
MATH_PROBLEM= DIRECT
SYSTEM_MEASUREMENTS= SI

MACH_NUMBER= 0.05
LOW_MACH_CORR= YES
AOA= 0.0
SIDESLIP_ANGLE= 0.0

INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS

FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 300.0
FREESTREAM_TEMPERATURE_VE= 300.0

REF_DIMENSIONALIZATION= DIMENSIONAL

FLUID_MODEL= MUTATIONPP
GAS_MODEL= ArH2_87_13
TRANSPORT_COEFF_MODEL= WILKE

KIND_TURB_MODEL= NONE

% ordine specie: (Ar, H2, H)
GAS_COMPOSITION= ( 0.9925, 0.0075, 1.0E-12 )

MARKER_ISOTHERMAL= ( WALL_IN, 300.0, ELECTRODE_BODY, 300.0, WALL1, 1500.0, ELECTRODE, 1500.0, WALL2, 1500.0 )
MARKER_PLOTTING= ( WALL_IN, ELECTRODE_BODY, WALL1, ELECTRODE, WALL2 )
MARKER_SYM= ( SYMMETRY, SIDE )


MARKER_SUPERSONIC_INLET= ( INFLOW, 300.0, 130000.0, 20.0, 0.0, 0.0 )
INLET_TEMPERATURE_VE= 300.0
INLET_GAS_COMPOSITION= ( 0.9925, 0.0075, 1.0E-12 )

FROZEN_MIXTURE= YES

MARKER_OUTLET= ( OUTFLOW, 101325.0 )

MARKER_ANALYZE= ( INFLOW, OUTFLOW )
HISTORY_OUTPUT= ( ITER, RMS_RES, CFL_NUMBER, FLOW_COEFF_SURF )


NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES

% Adaptive time stepping parameters
CFL_NUMBER= 0.1
CFL_ADAPT= NO
CFL_ADAPT_PARAM= ( 0.3, 1.2, 0.0005, 1.0 )
MAX_DELTA_TIME= 1E6

MUSCL_FLOW= NO

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 0
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 50

MGLEVEL= 0

% Scheme that improves the convergence of the flow solution
CONV_NUM_METHOD_FLOW= MSW

% Actually, we are seeing that the entropy coefficient does not affect at all the solution, maybe we can modify the code
ENTROPY_FIX_COEFF= 220.42

%%%%%%%%%%%%%%%%%%%%%%%
% HEAT SOURCE MODEL
%%%%%%%%%%%%%%%%%%%%%%%

HEAT_SOURCE = YES

AXISYMMETRIC= YES

% Q(x,r) = Q0 * exp(-0.5*((r - y0)/sigma_r)^2)
%             * 0.5*(1 + tanh((x - x_start)/delta_on))    smooth switch-on near the cathode tip
%             * exp(-(x - x_start)/L_decay)                decay towards the anode
%             * 0.5*(1 - tanh((x - x_end)/delta_off))      smooth switch-off at the anode start
% Geometry (Nozzle_rev14): cathode tip x = 22 mm, throat x = 29 mm, divergent ends x = 60 mm.
% Old run (sharp window 35-80 mm, Q0 = 3.0E10, L_decay = 20 mm) deposited ~34.8 kW.

% Total deposited power [W]: if > 0, Q0 is computed from it (HEAT_SOURCE_VAL is ignored)
HEAT_SOURCE_POWER= 15000                               % P_pl = 0.70 x 73 V x 500 A [W]

% Amplitude Q0 [W/m^3], used only if HEAT_SOURCE_POWER <= 0
HEAT_SOURCE_VAL= 3.0E10

% HEAT_SOURCE_ROTATION_Z = 0.0

% (x_start, y_center, z_center) [m]  (old: 0.035, 0.0004, 0.0)
HEAT_SOURCE_CENTER= ( 0.0225, 0.0, 0.0 )

% (x_end, sigma_r, L_decay) [m]  (old: 0.080, 0.007, 0.020)
HEAT_SOURCE_AXES= ( 0.040, 0.002, 0.005 )

% (delta_on, delta_off) [m] tanh ramp widths, 0 = sharp step (old behaviour); delta_on < L_decay
HEAT_SOURCE_RAMP= ( 0.001, 0.003 )

% GAUSSIAN_ARC OPTIONS

HEAT_SOURCE_MODEL= GAUSSIAN_ARC
HEAT_SOURCE_ORIGIN= 0.022                                 % punta del catodo nella rev14 [m]
HEAT_SOURCE_ARC_START= ( 1.0E-3, 2.0 )                    % L_s, n           -> scelta nostra
HEAT_SOURCE_ARC_PEAK=  ( 1.45E-3, 10.0E-3 )               % r_p0, L_c        -> dal PDF
HEAT_SOURCE_ARC_WIDTH= ( 0.6E-3, 0.03, 0.5E-3, 4.0E-3 )   % s0, k_s, s_A, L_w -> scelta nostra
HEAT_SOURCE_ARC_END=   ( 38.0E-3, 37.0E-3, 1.0E-3 )       % L, z_end, delta_off


ITER= 500000
CONV_RESIDUAL_MINVAL= -16
CONV_STARTITER= 50

MESH_FILENAME= PRIMO_TEST/Nozzle_rev14.su2
MESH_FORMAT= SU2
OUTPUT_FILES= RESTART_ASCII, PARAVIEW_ASCII, SURFACE_PARAVIEW_ASCII
OUTPUT_WRT_FREQ= 5000
WRT_RESTART_OVERWRITE= NO
RESTART_FILENAME= PRIMO_TEST/output/restart_gauss

VOLUME_FILENAME= PRIMO_TEST/vtk/vol_gauss
SURFACE_FILENAME= PRIMO_TEST/vtk/surface_gauss
WRT_VOLUME_OVERWRITE= YES
RESTART_SOL= YES
SOLUTION_FILENAME= PRIMO_TEST/output/restart_19
READ_BINARY_RESTART= NO

% Explicit time integration method using Runge-Kutta 
TIME_DISCRE_FLOW= RUNGE-KUTTA_EXPLICIT 
RK_ALPHA_COEFF= ( 0.25, 0.3333, 0.5, 1.0 )
