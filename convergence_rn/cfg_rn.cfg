%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% SU2 configuration file - plasma torch Ar/H2 87/13

% ultra-stable first ignition version

%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

  

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%

  

SOLVER= NEMO_NAVIER_STOKES

MATH_PROBLEM= DIRECT

SYSTEM_MEASUREMENTS= SI

  

MACH_NUMBER= 0.05

LOW_MACH_CORR= YES

AOA= 0.0

SIDESLIP_ANGLE= 0.0

  

INIT_OPTION= TD_CONDITIONS

FREESTREAM_OPTION= TEMPERATURE_FS

  

FREESTREAM_PRESSURE= 101325.0

FREESTREAM_TEMPERATURE= 300.0

FREESTREAM_TEMPERATURE_VE= 300.0

  

REF_DIMENSIONALIZATION= DIMENSIONAL

  

FLUID_MODEL= MUTATIONPP

GAS_MODEL= ArH2_87_13

TRANSPORT_COEFF_MODEL= WILKE

  

KIND_TURB_MODEL= NONE

  

% ordine specie: (Ar, H2, H)

GAS_COMPOSITION= ( 0.9925, 0.0075, 1.0E-12 )

  

MARKER_ISOTHERMAL= ( WALL1, 300.0, ELECTRODE, 300.0, WALL2, 300.0 )

MARKER_SYM= ( SYMMETRY )

  

MARKER_SUPERSONIC_INLET= ( INFLOW, 300.0, 130000.0, 20.0, 0.0, 0.0 )

INLET_TEMPERATURE_VE= 300.0

INLET_GAS_COMPOSITION= ( 0.9925, 0.0075, 1.0E-12 )

  

FROZEN_MIXTURE= YES

  

MARKER_OUTLET= ( OUTFLOW, 101325.0 )

  

% ------------- ENERGY BALANCE MONITORING (inflow/outflow + wall) -------------%

% Mass-flow-weighted averages on INFLOW/OUTFLOW (bulk enthalpy for the energy balance).

% NOTE: axisymmetric weighting (2*pi*y) IS applied correctly for these MARKER_ANALYZE

% fields, unlike the TOTAL_HEATFLUX/HEAT group (see MARKER_MONITORING note below).

MARKER_ANALYZE= ( INFLOW, OUTFLOW )

MARKER_ANALYZE_AVERAGE= MASSFLUX

  

% Needed so TOTAL_HEATFLUX(_ON_SURFACE) gets computed at all; KNOWN BUG: this

% quantity does NOT include the 2*pi*y axisymmetric weight in this SU2 version

% (CFVMFlowSolverBase.inl ~line 2714) -> do not trust it for the wall-loss number,

% use the manual surface_flow.vtk integration script instead. Kept here only so the

% (uncorrected) value is visible on screen as a rough sanity indicator.

MARKER_MONITORING= ( WALL1, ELECTRODE, WALL2 )

  

% Only markers listed here are written into the surface output file below.

% Restricting to the three wall markers means surface_flow.vtk contains ONLY

% wall cells, so the Python integration script doesn't need to filter by marker.

MARKER_PLOTTING= ( WALL1, ELECTRODE, WALL2 )

  

NUM_METHOD_GRAD= GREEN_GAUSS

  

CFL_NUMBER= 0.05

CFL_ADAPT= YES

CFL_ADAPT_PARAM= ( 0.1, 1.2, 0.0005, 0.4 )

MAX_DELTA_TIME= 1E6

  

MUSCL_FLOW= NO

SLOPE_LIMITER_FLOW= NONE

  

LINEAR_SOLVER= FGMRES

LINEAR_SOLVER_PREC= ILU

LINEAR_SOLVER_ILU_FILL_IN= 0

LINEAR_SOLVER_ERROR= 1E-4

LINEAR_SOLVER_ITER= 50

  

MGLEVEL= 0

  

CONV_NUM_METHOD_FLOW= ROE

ENTROPY_FIX_COEFF= 0.5

TIME_DISCRE_FLOW= EULER_EXPLICIT

  

%%%%%%%%%%%%%%%%%%%%%%%

% HEAT SOURCE MODEL

%%%%%%%%%%%%%%%%%%%%%%%

  

HEAT_SOURCE = YES

  

AXISYMMETRIC= YES

  

% Power volume max [W/m^3]

HEAT_SOURCE_VAL= 1.2E10

  

% HEAT_SOURCE_ROTATION_Z = 0.0

  

% (x_start, y_center, z_center) [m]

HEAT_SOURCE_CENTER= ( 0.035, 0.0004, 0.0 )

  

% (x_end, sigma_r, L_decay) [m]

HEAT_SOURCE_AXES= ( 0.080, 0.0045, 0.012 )

  

ITER= 2000000

CONV_RESIDUAL_MINVAL= -16

CONV_STARTITER= 50

  

% ------------------------------- OUTPUT FIELDS -------------------------------%

% Console: residuals + the bulk mass-flow/temperature analyze fields.

SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY_0, RMS_DENSITY_1, RMS_DENSITY_2, RMS_MOMENTUM-X, RMS_MOMENTUM-Y, RMS_ENERGY, RMS_ENERGY_VE, SURFACE_MASSFLOW, SURFACE_STATIC_TEMPERATURE, SURFACE_TOTAL_TEMPERATURE)

  

% History csv: FLOW_COEFF (aggregate Avg_Massflow etc.) and FLOW_COEFF_SURF (per-marker

% "Avg_Massflow(INFLOW)"/"Avg_Enthalpy(OUTFLOW)" columns) are DISTINCT groups in SU2 -

% both must be listed explicitly to get the per-marker columns the analysis script needs.

% HEAT = uncorrected TOTAL_HEATFLUX, see caveat above.

HISTORY_OUTPUT= (ITER, RMS_RES, FLOW_COEFF, FLOW_COEFF_SURF, HEAT)

  

% Volume/surface files: PRIMITIVE group carries Heat_Flux; COORDINATES needed to

% integrate q_w*2*pi*y*ds by hand from the surface file.

VOLUME_OUTPUT= (COORDINATES, SOLUTION, PRIMITIVE, RESIDUAL)

  

MESH_FILENAME= PRIMO_TEST/Nozzle_rev12.su2

MESH_FORMAT= SU2

OUTPUT_FILES= RESTART_ASCII, PARAVIEW_ASCII, SURFACE_PARAVIEW_ASCII

OUTPUT_WRT_FREQ= 10000

WRT_RESTART_OVERWRITE= NO

RESTART_FILENAME= PRIMO_TEST/output/restart

SURFACE_FILENAME= PRIMO_TEST/output/surface_flow

WRT_VOLUME_OVERWRITE= NO

RESTART_SOL= YES

SOLUTION_FILENAME= PRIMO_TEST/output/restart_4

READ_BINARY_RESTART= NO